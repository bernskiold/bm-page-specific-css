name: Tests

on:
    push:
        branches:
            - master
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: tests-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        name: Tests
        uses: bernskiold/.github/.github/workflows/wordpress-plugin-tests.yml@main
        with:
            # composer lint (phpcs) and npm run lint (ESLint + phpcs).
            lint: true
